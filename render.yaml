services:
  - type: web
    name: semitrax-website
    runtime: static
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /reset-password
        destination: /reset-password.html
      - type: rewrite
        source: /reset-password/
        destination: /reset-password.html
    headers:
      - path: /reset-password*
        name: Cache-Control
        value: no-store
      - path: /reset-password*
        name: Referrer-Policy
        value: no-referrer
      - path: /reset-password*
        name: X-Frame-Options
        value: DENY
      - path: /reset-password*
        name: X-Content-Type-Options
        value: nosniff
      - path: /reset-password*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://semitrax-api.onrender.com; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'"

      - path: /driver/*
        name: Referrer-Policy
        value: no-referrer
      - path: /driver/*
        name: X-Content-Type-Options
        value: nosniff
      - path: /driver/*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://semitrax-api.onrender.com; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'"
      - path: /driver/sw.js
        name: Cache-Control
        value: no-cache
